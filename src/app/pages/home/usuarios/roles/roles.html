<div class="container">
  <div class="header">
    <div class="header-info">
      <h1>Roles</h1>
      <p>Administración de permisos por rol</p>
    </div>
    <p-button label="Agregar roles" icon="pi pi-plus" size="large" ></p-button>
</div>
  <div class="table-container">
    <p-table
      class="tabla"
      #dt2
      [value]="roles()"
      dataKey="id"
      size="small"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [loading]="loading()"
      [paginator]="true"
      [globalFilterFields]="['nombre', 'descripcion']"
    >
      <ng-template #caption>
        <div class="table-header">
              <span class="table-title"></span>
          <p-iconfield iconPosition="left">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input
              pInputText
              type="text"
              (input)="dt2.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Buscar rol..."
            />
          </p-iconfield>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th>Num.</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th style="width: 120px">Acciones</th>
        </tr>

        <tr>
          <th></th>
          <th>
            <p-columnFilter field="nombre" type="text" placeholder="Nombre" filterOn="input" ariaLabel="Filtrar nombre"></p-columnFilter>
          </th>
          <th>
            <p-columnFilter field="descripcion" type="text" placeholder="Descripción" filterOn="input" ariaLabel="Filtrar descripción"></p-columnFilter>
          </th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-rol let-rowIndex="rowIndex">
        <tr>
          <td>{{ rowIndex + 1 }}</td>
          <td>{{ rol.name }}</td>
          <td>{{ rol.description || 'Sin descripción' }}</td>
          <td>
            <div class="actions">
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                [rounded]="true"
                pTooltip="Eliminar"
                (click)="eliminarRol(rol, $event)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="empty-message">No se encontraron roles.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
