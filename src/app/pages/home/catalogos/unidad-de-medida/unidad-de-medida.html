<div class="container">
	<div class="header">
		<div class="header-info">
			<h1>Unidades de medida</h1>
			<p>Catálogo de unidades de medida</p>
		</div>
		<p-button label="Agregar unidad" icon="pi pi-plus" size="large" (click)="onAgregar()"></p-button>
	</div>

	<div class="table-container">
		<p-table #dt2 [value]="unidades()" dataKey="id" size="small" [rows]="10"
			[rowsPerPageOptions]="[10, 25, 50]" [loading]="loading()" [paginator]="true"
			[globalFilterFields]="['nombre', 'abreviatura']">
			<ng-template #caption>
				<div class="table-header">
					<span class="table-title"></span>
					<p-iconfield iconPosition="left">
						<p-inputicon><i class="pi pi-search"></i></p-inputicon>
						<input pInputText type="text" (input)="dt2.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar unidad..." />
					</p-iconfield>
				</div>
			</ng-template>
			<ng-template #header>
				<tr>
					<th>Num.</th>
					<th>Nombre</th>
					<th>Abreviatura</th>
					<th style="width: 140px">Acciones</th>
				</tr>
				<tr>
					<th></th>
					<th><p-columnFilter field="nombre" type="text" placeholder="Nombre" filterOn="input" ariaLabel="Filtrar unidad"></p-columnFilter></th>
					<th><p-columnFilter field="abreviatura" type="text" placeholder="Abreviatura" filterOn="input" ariaLabel="Filtrar abreviatura"></p-columnFilter></th>
					<th></th>
				</tr>
			</ng-template>
			<ng-template #body let-unidad let-rowIndex="rowIndex">
				<tr>
					<td>{{ rowIndex + 1 }}</td>
					<td>{{ unidad.nombre }}</td>
					<td>{{ unidad.abreviatura }}</td>
					<td>
						<div class="actions">
							<p-button icon="pi pi-pencil" severity="info" [text]="true" [rounded]="true" pTooltip="Editar" (click)="editarUnidad(unidad)"></p-button>
							<p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" pTooltip="Eliminar" (click)="eliminarUnidad(unidad, $event)"></p-button>
						</div>
					</td>
				</tr>
			</ng-template>
			<ng-template #emptymessage>
				<tr><td colspan="4" class="empty-message">No se encontraron unidades de medida.</td></tr>
			</ng-template>
		</p-table>
	</div>
</div>

@if (abrirModal) {
	<app-nueva-unidad-de-medida (cerrar)="abrirModal = false" (guardar)="crearUnidad($event)"></app-nueva-unidad-de-medida>
}
