<div class="container">
	<div class="header">
		<div class="header-info">
			<h1>Subcategorías</h1>
			<p>Catálogo de subcategorías</p>
		</div>
		<p-button label="Agregar subcategoría" icon="pi pi-plus" size="large" [loading]="loadingCategorias()" (click)="onAgregar()"></p-button>
	</div>

	<div class="table-container">
		<p-table #dt2 class="tabla" [value]="subcategorias()" dataKey="id" size="small" [rows]="10"
			[rowsPerPageOptions]="[10, 25, 50]" [loading]="loading()" [paginator]="true"
			[globalFilterFields]="['name', 'description']">
			<ng-template #caption>
				<div class="table-header">
					<span class="table-title"></span>
					<p-iconfield iconPosition="left">
						<p-inputicon><i class="pi pi-search"></i></p-inputicon>
						<input pInputText type="text" (input)="dt2.filterGlobal($any($event.target).value, 'contains')"
							placeholder="Buscar subcategoría..." />
					</p-iconfield>
				</div>
			</ng-template>
			<ng-template #header>
				<tr>
					<th>Num.</th>
					<th>Subcategoria</th>
					<th>Categoria</th>
					<th>Descripción de subcategoria</th>
					<th style="width: 140px">Acciones</th>
				</tr>
				<tr>
					<th></th>
					<th><p-columnFilter field="nombre" type="text" placeholder="Nombre" filterOn="input" ariaLabel="Filtrar subcategoría"></p-columnFilter></th>
					<th><p-columnFilter field="categoria" type="text" placeholder="Categoria" filterOn="input" ariaLabel="Filtrar categoria"></p-columnFilter></th>
					<th><p-columnFilter field="descripcion" type="text" placeholder="Descripción" filterOn="input" ariaLabel="Filtrar descripción"></p-columnFilter></th>
					<th></th>
				</tr>
			</ng-template>
			<ng-template #body let-subcategoria let-rowIndex="rowIndex">
				<tr>
					<td>{{ rowIndex + 1 }}</td>
					<td>{{ subcategoria.nombre }}</td>
					<td>{{ subcategoria.categoria.nombre }}</td>
					<td>{{ subcategoria.descripcion }}</td>
					<td>
						<div class="actions">
							<p-button icon="pi pi-pencil" severity="info" [text]="true" [rounded]="true" pTooltip="Editar" (click)="editarSubcategoria(subcategoria)"></p-button>
							<p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" pTooltip="Eliminar" (click)="eliminarSubcategoria(subcategoria, $event)"></p-button>
						</div>
					</td>
				</tr>
			</ng-template>
			<ng-template #emptymessage>
				<tr><td colspan="4" class="empty-message">No se encontraron subcategorías.</td></tr>
			</ng-template>
		</p-table>
	</div>
</div>

@if (abrirModal) {
	<app-nueva-subcategoria 
    [categorias]="categoriasDatos"
	[subcategoriaInicial]="subcategoriaEnEdicion"
	[modoEdicion]="!!subcategoriaEnEdicion"
	(cerrar)="abrirModal = false; subcategoriaEnEdicion = null" 
    (guardar)="crearSubcategoria($event)">
</app-nueva-subcategoria>
}
