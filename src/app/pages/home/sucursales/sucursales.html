<div class="container">
	<div class="header">
		<div class="header-info">
			<h1>Sucursales</h1>
			<p>Administración de sucursales</p>
		</div>
		<p-button label="Agregar sucursal" icon="pi pi-plus" size="large" [loading]="loadingAgregar()" (click)="onAgregar()"></p-button>
	</div>

	<div class="table-container">
		<p-table #dt2 [value]="sucursales()" dataKey="id" size="small" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading()" [paginator]="true" [globalFilterFields]="['nombre', 'ubicacion']">
			<ng-template #caption>
				<div class="table-header">
					<span class="table-title"></span>
					<p-iconfield iconPosition="left">
						<p-inputicon><i class="pi pi-search"></i></p-inputicon>
						<input pInputText type="text" (input)="dt2.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar sucursal..." />
					</p-iconfield>
				</div>
			</ng-template>
			<ng-template #header>
				<tr><th>Num.</th><th>Nombre</th><th>Número</th><th>Ubicación</th><th>Encargado</th><th style="width: 140px">Acciones</th></tr>
				<tr>
                    <th></th>
                    <th><p-columnFilter field="nombre" type="text" placeholder="Nombre" filterOn="input" ariaLabel="Filtrar nombre"></p-columnFilter></th>
                    <th><p-columnFilter field="numero" type="text" placeholder="Numero" filterOn="input" ariaLabel="Filtrar numero"></p-columnFilter></th>
                    <th><p-columnFilter field="ubicacion" type="text" placeholder="Ubicación" filterOn="input" ariaLabel="Filtrar ubicación"></p-columnFilter></th>
                    <th><p-columnFilter field="encargado" type="text" placeholder="Encargado" filterOn="input" ariaLabel="Filtrar encargado"></p-columnFilter></th>
                    <th></th>
                </tr>
			</ng-template>
			<ng-template #body let-sucursal let-rowIndex="rowIndex">
				<tr>
					<td>{{ rowIndex + 1 }}</td><td>{{ sucursal.nombre }}</td><td>{{ sucursal.numero_sucursal }}</td><td>{{ sucursal.ubicacion }}</td>
					<td>{{ sucursal.encargadoDeTienda.name}}</td>
					<td><div class="actions"><p-button icon="pi pi-pencil" severity="info" [text]="true" [rounded]="true" pTooltip="Editar" (click)="editarSucursal(sucursal)" /><p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" pTooltip="Eliminar" (click)="eliminarSucursal(sucursal, $event)" /></div></td>
				</tr>
			</ng-template>
			<ng-template #emptymessage><tr><td colspan="6" class="empty-message">No se encontraron sucursales.</td></tr></ng-template>
		</p-table>
	</div>
</div>

@if (abrirModal) {
	<app-nueva-sucursal [usuarios]="usuarios()" [sucursalInicial]="sucursalEnEdicion" [modoEdicion]="!!sucursalEnEdicion" (cerrar)="abrirModal = false; sucursalEnEdicion = null" (guardar)="guardarSucursal($event)"></app-nueva-sucursal>
}
