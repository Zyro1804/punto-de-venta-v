<p-dialog
  header="Registrar entrada"
  [modal]="true"
  [visible]="true"
  [style]="{ width: 'min(640px, 94vw)' }"
  [breakpoints]="{ '575px': '96vw' }"
  [draggable]="false"
  (onHide)="cerrarDialog()"
>
  <form class="form-grid" (ngSubmit)="guardar()" #form="ngForm">
    <div class="field-group">
      <label for="entrada-producto">Producto <span>*</span></label>
      <p-select
        id="entrada-producto"
        [options]="productos"
        [(ngModel)]="productoId"
        name="productoId"
        optionLabel="nombre"
        optionValue="id"
        placeholder="Selecciona un producto"
        [filter]="true"
        filterBy="nombre"
        [showClear]="true"
        appendTo="body"
        required
      ></p-select>
    </div>
    <div class="field-group">
      <label for="entrada-sucursal">Sucursal <span>*</span></label>
      <p-select
        id="entrada-sucursal"
        [options]="sucursales"
        [(ngModel)]="sucursalId"
        name="sucursalId"
        optionLabel="nombre"
        optionValue="id"
        placeholder="Selecciona una sucursal"
        [filter]="true"
        filterBy="nombre"
        [showClear]="true"
        appendTo="body"
        required
      ></p-select>
    </div>
    <div class="field-group">
      <label for="entrada-cantidad">Cantidad <span>*</span></label>
      <input
        id="entrada-cantidad"
        class="field"
        type="number"
        min="1"
        step="1"
        [(ngModel)]="cantidad"
        name="cantidad"
        required
      />
    </div>
    <div class="field-group">
      <label for="entrada-lote">Lote <span>*</span></label>
      <input
        id="entrada-lote"
        class="field"
        type="text"
        [(ngModel)]="lote"
        name="lote"
        placeholder="Ej. LOTE-001"
        required
      />
    </div>
    <div class="field-group">
      <label for="entrada-caducidad">Fecha de caducidad</label>
      <input
        id="entrada-caducidad"
        class="field"
        type="date"
        [(ngModel)]="fechaCaducidad"
        name="fechaCaducidad"
      />
    </div>
    <div class="field-group field-full">
      <label for="entrada-observaciones">Observaciones</label>
      <textarea
        id="entrada-observaciones"
        class="field"
        [(ngModel)]="observaciones"
        name="observaciones"
        rows="3"
        placeholder="Información adicional (opcional)"
      ></textarea>
    </div>
    @if (error) {
      <div class="form-error" role="alert"><i class="pi pi-exclamation-circle"></i>{{ error }}</div>
    }
  </form>
  <ng-template #footer>
    <p-button
      label="Cancelar"
      severity="secondary"
      [text]="true"
      (click)="cerrarDialog()"
    ></p-button>
    <p-button
      label="Guardar entrada"
      icon="pi pi-check"
      [loading]="saving"
      [disabled]="saving || form.invalid"
      (click)="guardar()"
    ></p-button>
  </ng-template>
</p-dialog>
