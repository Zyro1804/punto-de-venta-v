

  <p-dialog header="Agregar Nuevo Rol" [modal]="true" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [visible]="true" [style]="{ width: '50rem' }" [draggable]="false" (onHide)="cerrarDialog()">

  <div class="form-rol">
    <div class="section">
      <h3>Formulario de Roles</h3>
      <div class="form-grid">
        <div class="field ">
          <label class="required">Nombre</label>
          <input pInputText [(ngModel)]="rol.name" placeholder="Nombre del Rol" required/>
        </div>
        <div class="field field-full">
          <label class="required">Descripcion</label>
          <input pInputText [(ngModel)]="rol.description" placeholder="Descripcion del Rol" required/>
        </div>
      </div>
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="Guardar Rol"
      icon="pi pi-check"
      (click)="guardarRol()"
    />
  </ng-template>

</p-dialog>
