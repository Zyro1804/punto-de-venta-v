<p-dialog
  header="Agregar nuevo usuario"
  [modal]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [visible]="true"
  [style]="{ width: '50rem' }"
  [draggable]="false"
  (onHide)="cerrarDialog()"
>
  <div class="form-producto">
    <div class="section">
      <h3>Información del usuario</h3>

      <div class="form-grid">
        <div class="field">
          <label class="required">Nombre</label>
          <input pInputText [(ngModel)]="usuario.name" placeholder="Nombre completo" required />
        </div>

        <div class="field">
          <label class="required">Correo</label>
          <input pInputText [(ngModel)]="usuario.email" placeholder="correo@ejemplo.com" required />
        </div>
        <div class="field">
          <label class="required">Numero de Telefono</label>
           <input pInputText [(ngModel)]="usuario.numero_telefono" placeholder="Nombre completo" required />
        </div>
        <div class="field">
          <label class="required">Rol</label>
          <p-select
            [options]="roles"
            [(ngModel)]="usuario.roleId"
            optionLabel="name"
            optionValue="id"
            placeholder="Selecciona un rol"
            appendTo="body"
            class="w-full"
          />
        </div>

        <div class="field field-full">
          <label class="required">Contraseña</label>
          <p-password
            [(ngModel)]="usuario.password"
            [toggleMask]="true"
            [feedback]="true"
            placeholder="Contraseña"
            [inputStyle]="{ width: '100%' }"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
        
      </div>
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Guardar usuario" icon="pi pi-check" (click)="guardarUsuario()" />
  </ng-template>
</p-dialog>
