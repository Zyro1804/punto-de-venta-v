<p-toolbar>

  <ng-template #start>
    <div class="header-title">
      <span>Punto de Venta</span>
    </div>
  </ng-template>

  <ng-template #end>
    <div class="header-user">

      <div class="user-info">
        <span class="user-name">Jorge Flores</span>
        <small>Administrador</small>
      </div>

      <p-avatar
        label="JF"
        shape="circle"
      />

    </div>
  </ng-template>

</p-toolbar>
